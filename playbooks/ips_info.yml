---
# Usage:
#   ansible-playbook -i inventory/pidginhost.yml playbooks/ips_info.yml \
#     -e "ips_state=present ip_type=ipv4"
- name: Retrieve reserved IP addresses
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ips_state: present
    ip_type: ipv4

  tasks:
    - name: Query IP list
      pidginhost.cloud.ips_info:
        state: "{{ ips_state }}"
        ip_type: "{{ ip_type }}"
      register: ips_result

    - name: Show IP addresses
      ansible.builtin.debug:
        var: ips_result.ips
