---
# Usage:
#   ansible-playbook playbooks/ips_info.yml -e "ip_type=ipv6"
- name: List public IP addresses
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ip_type: ipv4                     # ipv4|ipv6

  tasks:
    - name: Query IP list
      pidginhost.cloud.ips_info:
        ip_type: "{{ ip_type }}"
      register: ips_result

    - name: Show IP addresses
      ansible.builtin.debug:
        var: ips_result.ips
