---
# Usage:
#   ansible-playbook -i inventory/pidginhost.yml playbooks/firewall.yml \
#    -e '{"firewall_ruleset_name":"web","firewall_rules":[{"direction":"in","action":"ACCEPT","protocol":"tcp","dport":"80"}]}'
#   # Delete the rules set
#   ansible-playbook -i inventory/pidginhost.yml playbooks/firewall.yml -e firewall_state=absent
- name: Manage a firewall rules set
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    firewall_state: present           # present|absent
    firewall_ruleset_name: "example-ruleset"
    firewall_purge_rules: false       # true deletes rules not listed below
    firewall_rules: []                # dictionaries with direction, action, protocol, source, sport, destination, dport

  tasks:
    - name: Ensure the rules set and its rules
      pidginhost.cloud.firewall:
        state: "{{ firewall_state }}"
        name: "{{ firewall_ruleset_name }}"
        rules: "{{ firewall_rules }}"
        purge_rules: "{{ firewall_purge_rules }}"
      register: firewall_result

    - name: Show the rules set
      ansible.builtin.debug:
        var: firewall_result.firewall
