---
# Usage:
#   # Create the server, or leave it unchanged when it exists
#   ansible-playbook playbooks/server.yml \
#     -e "server_hostname=web1.example.com server_ssh_pub_key_id=123"
#
#   # Delete it
#   ansible-playbook playbooks/server.yml \
#     -e "server_state=absent server_hostname=web1.example.com"
- name: Manage a PidginHost server
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    server_state: present
    server_hostname: web1.example.com
    server_image: ubuntu24
    server_package: cloudv-2
    server_ssh_pub_key_id: null
    server_ssh_pub_key: null
    server_destroy_protection: null

  tasks:
    - name: Ensure the server is {{ server_state }}
      pidginhost.cloud.server:
        state: "{{ server_state }}"
        hostname: "{{ server_hostname }}"
        image: "{{ server_image }}"
        package: "{{ server_package }}"
        ssh_pub_key_id: "{{ server_ssh_pub_key_id | default(omit, true) }}"
        ssh_pub_key: "{{ server_ssh_pub_key | default(omit, true) }}"
        new_ipv4: true
        destroy_protection: "{{ server_destroy_protection if server_destroy_protection is not none else omit }}"
      register: server_result

    - name: Show the server
      ansible.builtin.debug:
        var: server_result.server
