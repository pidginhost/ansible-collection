---
# Usage:
#   # Add keys
#   ansible-playbook -i inventory/pidginhost.yml playbooks/ssh_key.yml \
#    -e '{"ssh_keys":["ssh-ed25519 AAAA... user@example.com"]}'
#   # Keep only the listed keys
#   ansible-playbook -i inventory/pidginhost.yml playbooks/ssh_key.yml \
#    -e '{"ssh_keys":["ssh-ed25519 AAAA... user@example.com"],"ssh_key_delete_others":true}'
#   # Remove keys
#   ansible-playbook -i inventory/pidginhost.yml playbooks/ssh_key.yml \
#    -e '{"ssh_key_state":"absent","ssh_keys":["ssh-ed25519 AAAA... user@example.com"]}'
- name: Manage SSH public keys
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ssh_key_state: present          # present|absent
    ssh_key_delete_others: false    # only with present
    ssh_keys: []

  tasks:
    - name: Manage keys
      pidginhost.cloud.ssh_key:
        state: "{{ ssh_key_state }}"
        ssh_pub_keys: "{{ ssh_keys }}"
        delete_others: "{{ ssh_key_delete_others }}"
      register: ssh_key_result
      when: ssh_keys | length > 0

    - name: Show changes
      ansible.builtin.debug:
        msg: "added={{ ssh_key_result.added_keys }} deleted={{ ssh_key_result.deleted_keys }}"
      when: ssh_key_result is not skipped
