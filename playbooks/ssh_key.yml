---
# Usage:
#   # Add Key
#   ansible-playbook -i inventory/pidginhost.yml playbooks/ssh_key.yml \
#    -e '{"ssh_key_state":"present","ssh_keys_desired":["ssh-ed25519 AAAA... user@example"]}'
#   # Remove Key
#   ansible-playbook -i inventory/pidginhost.yml playbooks/ssh_key.yml \
#    -e '{"ssh_key_state":"absent","ssh_keys_remove":["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHc+i7ZBW64xoh3hFg8xoZUsuied9JH77nSWbsP/8Q/X andrei.popescu.c@gmail.com]}'
- name: Manage SSH public keys
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ssh_key_state: present          # present|absent
    ssh_key_delete_others: false
    ssh_keys_desired: []
    ssh_keys_remove: []

  tasks:
    - name: Ensure desired keys are present individually
      pidginhost.cloud.ssh_key:
        state: present
        delete_others: false
        ssh_pub_key: "{{ item }}"
      loop: "{{ ssh_keys_desired }}"
      when:
        - ssh_key_state == 'present'
        - not ssh_key_delete_others
        - ssh_keys_desired | length > 0

    - name: Synchronize keys, removing any others
      pidginhost.cloud.ssh_key:
        state: present
        delete_others: true
        ssh_pub_key: "{{ ssh_keys_desired }}"
      when:
        - ssh_key_state == 'present'
        - ssh_key_delete_others
        - ssh_keys_desired | length > 0

    - name: Remove specific keys
      pidginhost.cloud.ssh_key:
        state: absent
        delete_others: false
        ssh_pub_key: "{{ item }}"
      loop: "{{ ssh_keys_remove }}"
      when:
        - ssh_key_state == 'absent'
        - ssh_keys_remove | length > 0
