---
# Usage:
#   ansible-playbook -i inventory/pidginhost.yml playbooks/packages_info.yml
- name: Retrieve available server packages
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    packages_state: present

  tasks:
    - name: Query package catalogue
      pidginhost.cloud.packages_info:
        state: "{{ packages_state }}"
      register: packages_result

    - name: Show packages
      ansible.builtin.debug:
        var: packages_result.packages
