---
# Usage:
#   # Attach an IP address and restart the server so the guest picks it up
#   ansible-playbook playbooks/ip_action.yml \
#     -e "ip_address=192.0.2.10 server_hostname=web1.example.com reboot=true"
#   # Detach an IP address from whatever server holds it
#   ansible-playbook playbooks/ip_action.yml -e "ip_action_state=absent ip_address=192.0.2.10"
- name: Attach or detach a public IP address
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ip_action_state: present          # present|absent
    ip_address: null
    server_hostname: null
    server_id: null
    reboot: false

  tasks:
    - name: Apply IP action
      pidginhost.cloud.ip_action:
        state: "{{ ip_action_state }}"
        ip_address: "{{ ip_address }}"
        server_hostname: "{{ server_hostname or omit }}"
        server_id: "{{ server_id or omit }}"
        reboot: "{{ reboot | bool }}"
      register: ip_action_result

    - name: Show IP action result
      ansible.builtin.debug:
        var: ip_action_result.ip
