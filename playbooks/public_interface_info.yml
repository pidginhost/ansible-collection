---
# Usage:
#   ansible-playbook playbooks/public_interface_info.yml -e "public_interface_server_id=12345"
#   ansible-playbook playbooks/public_interface_info.yml -e "public_interface_hostname=web1.example.com"
- name: Retrieve server public interface
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    public_interface_server_id: null
    public_interface_hostname: null

  tasks:
    - name: Query public interface
      pidginhost.cloud.public_interface_info:
        server_id: "{{ public_interface_server_id | default(omit, true) }}"
        server_hostname: "{{ public_interface_hostname | default(omit, true) }}"
      register: public_interface_result

    - name: Show public interface
      ansible.builtin.debug:
        var: public_interface_result.interfaces
