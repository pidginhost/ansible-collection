---
# Usage:
#   ansible-playbook -i inventory/pidginhost.yml playbooks/volumes_info.yml [-e "volumes_server_id=12345"]
- name: Retrieve volume information
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    volumes_server_id: null

  tasks:
    - name: Query volumes
      pidginhost.cloud.volumes_info:
        server_id: "{{ volumes_server_id | default(omit, true) }}"
      register: volumes_result

    - name: Show volumes
      ansible.builtin.debug:
        var: volumes_result.volumes
