---
# Usage:
#   ansible-playbook -i inventory/pidginhost.yml playbooks/volumes_products_info.yml
- name: Retrieve volume products
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Query volume products
      pidginhost.cloud.volumes_products_info:
      register: volumes_products_result

    - name: Show volume products
      ansible.builtin.debug:
        var: volumes_products_result.volumes
