---
# Usage:
#   ansible-playbook -i inventory/pidginhost.yml playbooks/volume.yml \
#     -e "volume_alias=data volume_hostname=web1.example.com volume_product=fast-storage volume_size_gigabytes=50"
#   ansible-playbook -i inventory/pidginhost.yml playbooks/volume.yml -e "volume_alias=data volume_state=absent"
- name: Manage volumes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    volume_state: present            # present|absent
    volume_alias: data
    volume_hostname: null
    volume_product: null
    volume_project: null
    volume_size_gigabytes: null

  tasks:
    - name: Apply volume state
      pidginhost.cloud.volume:
        state: "{{ volume_state }}"
        volume_alias: "{{ volume_alias }}"
        hostname: "{{ volume_hostname | default(omit, true) }}"
        product: "{{ volume_product | default(omit, true) }}"
        project: "{{ volume_project | default(omit, true) }}"
        size_gigabytes: "{{ volume_size_gigabytes | default(omit, true) }}"
      register: volume_result

    - name: Show volume
      ansible.builtin.debug:
        var: volume_result.volume
