---
# Usage:
#   # Change the package
#   ansible-playbook playbooks/server_action_resize.yml \
#     -e "server_resize_hostname=web1.example.com server_resize_package=cloudv-3"
#
#   # Grow a volume
#   ansible-playbook playbooks/server_action_resize.yml \
#     -e "server_resize_hostname=web1.example.com server_resize_disk=true \
#         server_resize_volume_alias=data server_resize_size_gigabytes=60"
- name: Resize server resources
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    server_resize_hostname: null
    server_resize_id: null
    server_resize_disk: false
    server_resize_package: null
    server_resize_volume_alias: null
    server_resize_size_gigabytes: null
    server_resize_project: null
    server_resize_timeout: 600

  tasks:
    - name: Apply resize action
      pidginhost.cloud.server_action_resize:
        server_id: "{{ server_resize_id | default(omit, true) }}"
        server_hostname: "{{ server_resize_hostname | default(omit, true) }}"
        disk: "{{ server_resize_disk | bool }}"
        package: "{{ server_resize_package | default(omit, true) }}"
        volume_alias: "{{ server_resize_volume_alias | default(omit, true) }}"
        size_gigabytes: "{{ server_resize_size_gigabytes | default(omit, true) }}"
        project: "{{ server_resize_project | default(omit, true) }}"
        timeout: "{{ server_resize_timeout | int }}"
      register: server_resize_result

    - name: Show resize result
      ansible.builtin.debug:
        var: server_resize_result.action
