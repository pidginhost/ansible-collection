---
# Usage:
#   ansible-playbook -i inventory/pidginhost.yml playbooks/firewall_action.yml \
#    -e firewall_server_hostname=web1.example.com \
#    -e firewall_rules_set_name=web \
#    -e firewall_policy_in=DROP
- name: Apply a firewall rules set and policies to a server
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    firewall_server_hostname: "web1.example.com"
    firewall_rules_set_name: "web"
    firewall_policy_in: "DROP"
    firewall_policy_out: "ACCEPT"

  tasks:
    - name: Apply firewall settings to the public interface
      pidginhost.cloud.firewall_action:
        server_hostname: "{{ firewall_server_hostname }}"
        rules_set_name: "{{ firewall_rules_set_name | default(omit, true) }}"
        policy_in: "{{ firewall_policy_in | default(omit, true) }}"
        policy_out: "{{ firewall_policy_out | default(omit, true) }}"
      register: firewall_action_result

    - name: Show the public interface
      ansible.builtin.debug:
        var: firewall_action_result.firewall
