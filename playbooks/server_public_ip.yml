---
# Usage:
#   ansible-playbook playbooks/server_public_ip.yml -e "server_public_ip_hostname=web1.example.com"
- name: Retrieve server public IP addresses
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    server_public_ip_hostname: null
    server_public_ip_id: null

  tasks:
    - name: Query public IP addresses
      pidginhost.cloud.server_public_ip:
        server_id: "{{ server_public_ip_id | default(omit, true) }}"
        server_hostname: "{{ server_public_ip_hostname | default(omit, true) }}"
      register: server_public_ip_result

    - name: Show public IP addresses
      ansible.builtin.debug:
        msg: "IPv4 {{ server_public_ip_result.ipv4 }}, IPv6 {{ server_public_ip_result.ipv6 }}"
