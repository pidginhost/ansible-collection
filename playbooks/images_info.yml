---
# Usage:
#   ansible-playbook -i inventory/pidginhost.yml playbooks/images_info.yml
- name: Retrieve cloud images
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    images_state: present

  tasks:
    - name: Query image catalogue
      pidginhost.cloud.images_info:
        state: "{{ images_state }}"
      register: images_result

    - name: Show images
      ansible.builtin.debug:
        var: images_result.images
