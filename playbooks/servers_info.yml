---
# Usage:
#   ansible-playbook playbooks/servers_info.yml
#   ansible-playbook playbooks/servers_info.yml -e "servers_hostname=web1.example.com" -e '{"servers_include": ["usage"]}'
- name: Retrieve servers
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    servers_hostname: null
    servers_include: []                   # snapshots, usage, traffic, activity, boot_isos

  tasks:
    - name: Query servers
      pidginhost.cloud.servers_info:
        server_hostname: "{{ servers_hostname | default(omit, true) }}"
        include: "{{ servers_include | default(omit, true) }}"
      register: servers_result

    - name: Show servers
      ansible.builtin.debug:
        var: servers_result.servers
