---
# Usage:
#   ansible-playbook -i inventory/pidginhost.yml playbooks/profile_info.yml
- name: Retrieve account profile details
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    profile_state: present

  tasks:
    - name: Query account profile
      pidginhost.cloud.profile_info:
        state: "{{ profile_state }}"
      register: profile_result

    - name: Show account profile
      ansible.builtin.debug:
        var: profile_result.account
