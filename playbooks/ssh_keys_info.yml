---
# Usage:
#   ansible-playbook -i inventory/pidginhost.yml playbooks/ssh_keys_info.yml
- name: Retrieve SSH keys
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Query SSH keys
      pidginhost.cloud.ssh_keys_info:
      register: ssh_keys_result

    - name: Show SSH keys
      ansible.builtin.debug:
        var: ssh_keys_result.ssh_keys
