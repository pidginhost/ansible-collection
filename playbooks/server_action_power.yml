---
# Usage:
#   ansible-playbook playbooks/server_action_power.yml \
#     -e "server_power_hostname=web1.example.com server_power_state=shutdown server_force_power_off=true"
- name: Control server power state
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    server_power_state: shutdown          # start|stop|shutdown|reboot
    server_power_hostname: null
    server_power_id: null
    server_force_power_off: false
    server_power_timeout: 300

  tasks:
    - name: Apply power action
      pidginhost.cloud.server_action_power:
        server_id: "{{ server_power_id | default(omit, true) }}"
        server_hostname: "{{ server_power_hostname | default(omit, true) }}"
        state: "{{ server_power_state }}"
        force_power_off: "{{ server_force_power_off | bool }}"
        timeout: "{{ server_power_timeout | int }}"
      register: server_power_result

    - name: Show power status
      ansible.builtin.debug:
        var: server_power_result.action
