---
# Usage:
#   ansible-playbook -i inventory/pidginhost.yml playbooks/server_action_power.yml \
#     -e "server_power_state=shutdown \
#         server_power_hostname=my-host.example"
- name: Control server power state
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    server_power_state: shutdown          # start|stop|shutdown|reboot
    server_power_hostname: null
    server_power_id: null
    server_force_power_off: false
    server_power_timeout: 300

  tasks:
    - name: Validate target input
      ansible.builtin.assert:
        that:
          - server_power_hostname is not none or server_power_id is not none
        fail_msg: "Provide either server_power_hostname or server_power_id to target a server."

    - name: Build server power arguments
      ansible.builtin.set_fact:
        server_power_args: "{{ {
          'state': server_power_state,
          'force_power_off': server_force_power_off | bool,
          'timeout': server_power_timeout | int
        } }}"

    - name: Include power target by hostname
      ansible.builtin.set_fact:
        server_power_args: "{{ server_power_args | combine({'server_hostname': server_power_hostname}) }}"
      when: server_power_hostname is not none

    - name: Include power target by id
      ansible.builtin.set_fact:
        server_power_args: "{{ server_power_args | combine({'server_id': server_power_id}) }}"
      when: server_power_id is not none

    - name: Apply power action
      pidginhost.cloud.server_action_power: "{{ server_power_args }}"
      register: server_power_result

    - name: Show power action result
      ansible.builtin.debug:
        var: server_power_result.action
